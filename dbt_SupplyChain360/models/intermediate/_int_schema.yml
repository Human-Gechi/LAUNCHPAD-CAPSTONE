version: 2

models:
  - name: int_warehouse_to_store_efficiency
    description: >
      This model analyzes the efficiency of shipments from warehouses to stores.
      It helps identify bottlenecks and optimize logistics operations between warehouses and stores.
    columns:
      - name: warehouse_id
        description: "Unique identifier for the warehouse."
        data_tests:
          - not_null
          - no_whitespace
      - name: store_id
        description: "Unique identifier for the store."
        data_tests:
          - not_null
          - no_whitespace
      - name: store_city
        description: "City where the store is located."
        data_tests:
          - not_null
          - no_whitespace
      - name: store_state
        description: "State where the store is located."
        data_tests:
          - not_null
          - no_whitespace
      - name: warehouse_city
        description: "City where the warehouse is located."
        data_tests:
          - not_null
          - no_whitespace
      - name: warehouse_state
        description: "State where the warehouse is located."
        data_tests:
          - not_null
          - no_whitespace
      - name: shipping_distance
        description: "Categorized distance between warehouse and store locations."
        data_tests:
          - not_null
          - no_whitespace
          - accepted_values:
              arguments:
                values: ['Local (Same City)', 'Regional (Same State)', 'Long-Haul (Inter-State)']
      - name: route_performance_status
        description: "Assessment of the route's performance, indicating delay risks or efficiency."
        data_tests:
          - not_null
          - no_whitespace
          - accepted_values:
              arguments:
                values: ['High Delay Risk', 'Warehouse Delay', 'Good Route']

  - name: int_transactions_enriched
    description: This model enriches transaction data with product details and financial calculations.
    columns:
      - name: transaction_id
        description: "Unique identifier for each transaction."
        data_tests:
          - not_null
          - no_whitespace
      - name: store_id
        description: "Unique identifier for the store where the transaction occurred."
        data_tests:
          - not_null
          - no_whitespace
      - name: product_id
        description: "Unique identifier for the product sold."
        data_tests:
          - not_null
          - no_whitespace
      - name: product_name
        description: "Name of the product."
        data_tests:
          - not_null
          - no_whitespace
      - name: category
        description: "Product category."
        data_tests:
          - not_null
          - no_whitespace
      - name: brand
        description: "Brand of the product."
        data_tests:
          - not_null
          - no_whitespace
      - name: supplier_id
        description: "Unique identifier for the product's supplier."
        data_tests:
          - not_null
          - no_whitespace
      - name: quantity_sold
        description: "Number of units sold in the transaction."
        data_tests:
          - not_null
          - positive_value
      - name: selling_unit_price
        data_tests:
          - not_null
          - positive_value
      - name: supplier_unit_price
        data_tests:
          - not_null
          - positive_value
      - name: discount_pct
        data_tests:
          - not_null
          - positive_value
      - name: net_revenue
        data_tests:
          - not_null
          - positive_value
      - name: gross_revenue
        data_tests:
          - not_null
          - positive_value
      - name: total_expenses
        data_tests:
          - not_null
          - positive_value
      - name: discount_amount
        data_tests:
          - not_null
          - positive_value
      - name: net_profit_loss
        data_tests:
          - not_null
      - name: profit_margin_pct
        data_tests:
          - not_null
      - name: financial_status
        description: "Financial outcome of the transaction."
        data_tests:
          - not_null
          - no_whitespace

  - name: int_inventory_health
    description: This model evaluates the health of inventory for each product at each warehouse.
    columns:
      - name: warehouse_id
        data_tests:
          - not_null
          - no_whitespace
      - name: product_id
        data_tests:
          - not_null
          - no_whitespace
      - name: product_name
        data_tests:
          - not_null
          - no_whitespace
      - name: quantity_available
        data_tests:
          - not_null
          - positive_value
      - name: reorder_threshold
        data_tests:
          - not_null
          - positive_value
      - name: stock_to_threshold_ratio
        data_tests:
          - not_null
          - positive_value
      - name: stock_status
        description: "Inventory status."
        data_tests:
          - not_null
          - no_whitespace
          - accepted_values:
              arguments:
                values: ['Stock-Out', 'Below Reorder Threshold', 'Healthy', 'Sufficient']

  - name: int_shipments_performance
    description: This model tracks and analyzes the performance of shipments.
    columns:
      - name: shipment_id
        data_tests:
          - not_null
          - no_whitespace
      - name: warehouse_id
        data_tests:
          - not_null
          - no_whitespace
      - name: quantity_shipped
        data_tests:
          - not_null
          - positive_value
      - name: carrier
        data_tests:
          - not_null
          - no_whitespace
      - name: product_name
        data_tests:
          - not_null
          - no_whitespace
      - name: category
        data_tests:
          - not_null
          - no_whitespace
      - name: store_name
        data_tests:
          - not_null
          - no_whitespace
      - name: region
        data_tests:
          - not_null
          - no_whitespace
      - name: city
        data_tests:
          - not_null
          - no_whitespace
      - name: delivery_delay_days
        data_tests:
          - not_null
      - name: delivery_status
        description: "Status of the delivery."
        data_tests:
          - not_null
          - no_whitespace
          - accepted_values:
              arguments:
                values: ['Early', 'On time', 'Late']

  - name: int_supplier_products
    description: "Intermediate model mapping suppliers to their products, including supplier and product details."
    columns:
      - name: supplier_id
        description: "Unique identifier for the supplier."
        data_tests:
          - not_null
          - no_whitespace
      - name: supplier_name
        description: "Name of the supplier."
        data_tests:
          - not_null
          - no_whitespace
      - name: supplier_category
        description: "Category of products supplied by the supplier."
        data_tests:
          - not_null
          - no_whitespace
      - name: country
        description: "Country where the supplier is based."
        data_tests:
          - not_null
          - no_whitespace
      - name: product_id
        description: "Unique identifier for the product."
        data_tests:
          - not_null
          - no_whitespace
      - name: product_name
        description: "Name of the product."
        data_tests:
          - not_null
          - no_whitespace
      - name: brand
        description: "Brand of the product."
        data_tests:
          - not_null
          - no_whitespace
      - name: product_category
        description: "Category of the product."
        data_tests:
          - not_null
          - no_whitespace
      - name: unit_price
        description: "Unit price of the product."
        data_tests:
          - not_null
          - no_whitespace