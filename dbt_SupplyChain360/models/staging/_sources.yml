version: 2

sources:
  - name: supplychain360
    description: "SUPPLYCHAIN360 database from S3 buckets into Snowflake DW using Python script"
    database: SUPPLYCHAIN360DB
    schema: RAW_SUPPLYCHAIN

    tables:
      - name: inventory
        description: "Contains records of current products levels for all products across all warehouses."
        columns:
          - name: warehouse_id
            description: "Unique identifier for each warehouse"
          - name: product_id
            description: "Unique identifier for each product."
          - name: quantity_available
            description: "Number of inventory level."
          - name: reorder_threshold
            description: "The minimum inventory level at which a new order should be placed to replenish stock."
          - name: snapshot_date
            description: "The timestamp indicating when this record was captured in the snapshot."
          - name: s3_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"

      - name: stores
        description: "Information about all physical locations of stores"
        columns:
          - name: store_id
            description: "Unique identifier for each store"
          - name: store_name
            description: "Store name"
          - name: city
            description: "City where the store is located"
          - name: state
            description: "State where the store is located in the US."
          - name: region
            description: "Region in the US ; EAST, WEST, NORTH, SOUTH, MIDWEST"
          - name: store_open_date
            description: "Date the store was opened"
          - name: sheets_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"

      - name: warehouses
        description: "Details about warehouse facilities, including id, location, state"
        columns:
          - name: warehouse_id
            description: "Unique identifier for each warehouse"
          - name: city
            description: "City where the warehouse is located"
          - name: state
            description: "State where the warehouse is located in the US."
          - name: s3_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"

      - name: products
        description: "Master list of products, including id, names, categories, unit price."
        columns:
          - name: product_id
            description: "Unique identifier for each product"
          - name: product_name
            description: "Product name"
          - name: categories
            description: "Product Categories"
          - name: brand
            description: "Product brand name"
          - name: supplier_id
            description: "ID of the supplier"
          - name: unit_price
            description: "Cost of each product quantity"
          - name: s3_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"

      - name: suppliers
        description: "Information abour suppliers including country, supplier_name etc ..."
        columns:
          - name: supplier_id
            description: "Unique identifier for each supplier"
          - name: supplier_name
            description: "Supplier name."
          - name: category
            description: "Category of the products supplied"
          - name: country
            description: "Country where the supplier is located"
          - name: s3_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"

      - name: shipments
        description: "Information about shipments providing product id, warehouses information, carrier of shipments( UPS, FedX, DHL)."
        columns:
          - name: shipment_id
            description: "Unique identifier for each shipment made"
          - name: warehouse_id
            description: "ID of warehouse from which products were picked up for shipment"
          - name: store_id
            description: "Unique identifier for each store"
          - name: product_id
            description: "Unique identifier for each product."
          - name: quantity_shipped
            description: "Quantity number"
          - name: shipment_date
            description: "Date of shipments"
          - name: expected_delivery_date
            description: "Date product is expected to arrive"
          - name: actual_delivery_date
            description: "Date product arrived"
          - name: carrier
            description: "Name of shipment carrier"
          - name: s3_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"

      - name: transactions
        description: "Logs inventory transactions sales daily."
        columns:
          - name: transaction_id
            description: "UUID: A mix of string and numbers, likely a unique transaction identifier."
          - name: store_id
            description: "Unique identifier for stores"
          - name: product_id
            description: "Unique identifier for products"
          - name: quantity_sold
            description: "(inferred) Quantity bought."
          - name: unit_price
            description: "Cost of each product"
          - name: discount_pct
            description: "Discount of products cost"
          - name: sales_amount
            description: "Total cost if discount is available"
          - name: transaction_timestamp
            description: "Epoch/Unix time stored in microseconds"
          - name: rds_extraction_date
            description: "Timestamp when data was ingested into s3"
          - name: origin
            description: "Data source"
          - name: ingestion_date
            description: "Date the data was ingested from source s3 bucket to snowflake"