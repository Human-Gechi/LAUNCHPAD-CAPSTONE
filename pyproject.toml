[project]
name = "Capstone"
version = "0.1.0"
description = "Supply Chain 360 Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Human-Gechi", email = "okoliogechi74@gamil.com" }
]
dependencies = [
    "dbt-core==1.11.7",
    "dbt-snowflake==1.11.3",
    "boto3==1.34.89",
    "psycopg2-binary==2.9.9",
    "pandas==2.3.3",
    "gspread==6.0.2",
    "google-auth==2.49.1",
    "pytest==8.1.1",
    "ruff==0.15.9",
    "sqlfluff==3.0.7",
    "sqlfluff-templater-dbt==3.0.7",
    "apache-airflow-providers-postgres==6.6.2",
    "moto==5.1.22",
    "airflow-dbt-python==3.5.0",
    "apache-airflow-providers-google==21.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.5"
]


[tool.setuptools.packages.find]
include = ["ingestion*", "infrastructure*"]
exclude = ["awscliv2"]

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    "venv",
    "awscliv2",
    "README.md",
    ".env"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "I"]
