[project]
name = "Capstone-Pro"
version = "0.1.0"
description = "Supply Chain 360 Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Human-Gechi", email = "okoliogechi74@gamil.com" }
]
dependencies = [
    "boto3==1.42.71",
    "botocore==1.42.71",
    "jmespath==1.1.0",
    "python-dateutil==2.9.0.post0",
    "s3transfer==0.16.0",
    "six==1.17.0",
    "urllib3==2.6.3"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.5"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "infrastructure*"]
exclude = ["awscliv2"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "venv",
    "awscliv2",
    "README.md"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"