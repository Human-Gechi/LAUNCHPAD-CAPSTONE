[project]
name = "Capstone"
version = "0.1.0"
description = "Supply Chain 360 Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Human-Gechi", email = "okoliogechi74@gamil.com" }
]
dependencies = [
    "dbt-core==1.7.15",
    "dbt-snowflake==1.7.4",
    "snowflake-connector-python==4.4.0",
    "boto3==1.34.84",
    "psycopg2-binary==2.9.9",
    "pandas==2.2.2",
    "pyarrow==15.0.2",
    "gspread==6.0.2",
    "google-auth==2.29.0",
    "pytest==8.1.1",
    "ruff==0.4.2",
    "sqlfluff==3.0.7",
    "sqlfluff-templater-dbt==3.0.7",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.5"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "infrastructure*"]
exclude = ["awscliv2"]

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    "venv",
    "awscliv2",
    "README.md",
    ".env"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "I"]
