name: Build and Push Docker Image to ECR

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
            aws ecr get-login-password --region eu-north-1 | \
            docker login --username AWS --password-stdin 601955859589.dkr.ecr.eu-north-1.amazonaws.com
            
      - name: Build Docker image
        run: |
          docker build -t capstone:latest .

      - name: Tag Docker image
        run: |
          docker tag capstone:latest 601955859589.dkr.ecr.eu-north-1.amazonaws.com/capstone/dec-project

      - name: Push Docker image to ECR
        run: |
          docker push 601955859589.dkr.ecr.eu-north-1.amazonaws.com/capstone/dec-project