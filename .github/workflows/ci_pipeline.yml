name: SupplyChain360

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  code-linting-formatting:
    runs-on: ubuntu-latest
    env:
      DBT_SNOWFLAKE_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      DBT_SNOWFLAKE_USER: ${{ secrets.SF_USER }}
      DBT_SNOWFLAKE_PASSWORD: ${{ secrets.SF_PASSWORD }}
      DBT_SNOWFLAKE_ROLE: ${{ secrets.SF_ROLE }}
      DBT_SNOWFLAKE_DATABASE: ${{ secrets.SF_DB }}
      DBT_SNOWFLAKE_WAREHOUSE: ${{ secrets.SF_WH }}
      DBT_SNOWFLAKE_SCHEMA: ${{ secrets.SF_SCHEMA }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Install Project dependencies
        run: pip install -r requirements.txt

      - name: Run ruff
        run: ruff check .

      - name: Run ruff formatting check
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Debug dbt project
        run: dbt debug --project-dir dbt_SupplyChain360 --profiles-dir dbt_SupplyChain360

      - name: Compile dbt project
        run: dbt compile --project-dir dbt_SupplyChain360 --profiles-dir dbt_SupplyChain360

      - name: Lint SQL
        run: sqlfluff lint dbt_SupplyChain360/models dbt_SupplyChain360/snapshots